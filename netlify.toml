# Netlify Configuration for N8N RAG Chatbot
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command for frontend (Next.js)
  command = "cd frontend && npm install && npm run build"

  # Output directory for built files
  publish = "frontend/.next"

  # Functions directory (if using Netlify Functions)
  functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "18.17.0"

  # NPM version
  NPM_VERSION = "9.8.1"

  # Next.js build optimization
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

# Redirect rules for Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["admin"]}

# API proxy (backend will be deployed separately)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api-url.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # CSP will be configured in Next.js for better control

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Development context
[context.development]
  command = "cd frontend && npm run build"

[context.development.environment]
  NODE_ENV = "development"

# Production context
[context.production]
  command = "cd frontend && npm install && npm run build"

[context.production.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# Branch deploys
[context.branch-deploy]
  command = "cd frontend && npm install && npm run build"

# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-nextjs"
